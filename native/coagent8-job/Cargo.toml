[package]
name = "coagent8-job"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs one command in its own Windows Job Object, which ends the whole process tree when this helper ends."
license-file = "../../LICENSE"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_IO",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
