name: Release

# Phase C of the release process (release workflow rule 12, section 5). A release tag
# pushed by the owner builds the exact artifacts from a clean checkout and creates a
# DRAFT GitHub Release with them, plus signed build provenance for each artifact.
# This workflow never publishes the draft and never publishes to npm: the owner
# verifies the downloaded artifacts first (phases D and E); npm-publish.yml publishes
# the verified tarball once the owner publishes the release.
on:
  push:
    tags: ['v*']

# id-token and attestations sign the build provenance (Sigstore, GitHub attestations).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  draft:
    name: Draft release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tooling/documentation/package-lock.json
            tooling/vscode/package-lock.json

      # The tag must be vX.Y.Z (one numeric version for npm, the VSIX and the tag; REPO-003),
      # annotated, match package.json and sit on develop or a release line.
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a numeric vX.Y.Z tag"; exit 1
          fi
          git fetch --force origin "+refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]; then
            echo "::error::$tag is not an annotated tag"; exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$tag" ]; then
            echo "::error::package.json version $version does not match $tag"; exit 1
          fi
          on_branch=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            case "${ref#origin/}" in
              develop|[0-9]*.[0-9]*.x)
                if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then on_branch="${ref#origin/}"; fi ;;
            esac
          done
          if [ -z "$on_branch" ]; then
            echo "::error::$tag is not on develop or a release line"; exit 1
          fi
          echo "Tag $tag ($GITHUB_SHA) is on $on_branch"

      # The release PR adds the tester header (RELEASE-001e); without it no draft is built.
      - name: Require the release notes header
        run: node scripts/release-notes.cjs --check --tag "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix tooling/documentation
          npm ci --prefix tooling/vscode

      - name: Typecheck
        run: npm run typecheck

      - name: Verify dependency boundaries
        run: npm run check:dependencies

      - name: Validate and generate source API documentation
        run: |
          npm run lint:docs
          npm run docs

      - name: Build bundle
        run: npm run build

      - name: Run test suite with source coverage
        run: npm run test:coverage

      # Packs the npm tarball once, installs that exact file and records its SHA-256.
      - name: Pack and verify the exact npm tarball
        run: npm run test:consumer

      - name: Package the VS Code extension
        run: npm run package:vscode

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp ".artifacts/consumer/coagent8-$version.tgz" release/
          cp ".artifacts/consumer/coagent8-$version.tgz.manifest.json" release/
          cp ".artifacts/coagent8-mcp-$version.vsix" release/
          (cd release && sha256sum "coagent8-$version.tgz" "coagent8-mcp-$version.vsix" > SHA256SUMS)
          cat release/SHA256SUMS

      # A signed statement that this workflow built these exact files from this commit;
      # `gh attestation verify <file> --repo <owner>/<repo>` checks a download.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/coagent8-*.tgz
            release/coagent8-mcp-*.vsix

      - name: Generate release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The commits since the previous release tag. Root commits, such as GitHub's "Initial
          # commit" that the first release reaches, are no Conventional Commits: skip every one.
          skips=()
          for root in $(git rev-list --max-parents=0 "$GITHUB_SHA"); do skips+=(--skip-commit "$root"); done
          npx --no-install git-cliff --config cliff.release-notes.toml --current "${skips[@]}" --strip all > release/changelog.md
          node scripts/release-notes.cjs --tag "$GITHUB_REF_NAME" --changelog release/changelog.md \
            --sums release/SHA256SUMS --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --out release/notes.md

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          # A normal release, also below 1.0.0: the pre-release flag hides it from the
          # repository page (owner decision 2026-10-13, RELEASE-001c).
          gh release create "$tag" --draft --verify-tag \
            --title "CoAgent8 $tag" --notes-file release/notes.md \
            "release/coagent8-$version.tgz" "release/coagent8-mcp-$version.vsix" release/SHA256SUMS
