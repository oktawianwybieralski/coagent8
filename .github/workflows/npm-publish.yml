name: npm publish

# Phase E of the release process (rule 02, section 5). Publishing the verified
# GitHub Release is the owner's approval to publish its exact npm tarball to `next`
# through trusted publishing (OIDC) with provenance, without a GitHub environment.
# The owner later promotes a stable version to `latest` by hand (2026-10-19).
# Requires NPM_TRUSTED_PUBLISHING=true and a valid publisher (rule 02, section 8).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: read

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }} on npm
    if: vars.NPM_TRUSTED_PUBLISHING == 'true' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Checkout tagged repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download the release tarball and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "coagent8-$version.tgz" --pattern SHA256SUMS

      # The same file the owner verified: its checksum and the provenance of release.yml.
      - name: Verify checksum and build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          (cd release && sha256sum --check --ignore-missing --strict SHA256SUMS)
          grep -q " coagent8-$version.tgz\$" release/SHA256SUMS \
            || { echo "::error::SHA256SUMS lists no coagent8-$version.tgz"; exit 1; }
          gh attestation verify "release/coagent8-$version.tgz" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      # Publishes ./release/coagent8-X.Y.Z.tgz to `next` (scripts/publish-npm.cjs, RELEASE-001a/b1).
      - name: Publish on npm
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/publish-npm.cjs
