name: npm publish

# Phase E of the release process (Git workflow rule 02, section 5). Publishing the
# verified GitHub Release stages its exact npm tarball, never a rebuild, through npm
# trusted publishing (OIDC, no token) with provenance: `npm stage publish` to the `next`
# dist-tag (RELEASE-001b1). The owner then approves the staged version on npmjs.com with
# 2FA, which is the approval; there is no GitHub environment gate, whose rules blocked the
# job before. The owner promotes a version that proved stable to `latest` by hand. The job
# runs only after the owner set the repository variable NPM_TRUSTED_PUBLISHING to `true`
# (rule 02, section 8).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: read

jobs:
  publish:
    name: Stage ${{ github.event.release.tag_name }} on npm
    if: vars.NPM_TRUSTED_PUBLISHING == 'true' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Checkout tagged repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # Staged publishing needs npm 11.15.0 or later. This pinned npm is installed beside the
      # runner's and used only by the publish script (npm_execpath), which checks its version.
      - name: Install pinned npm for staging
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/npm" --no-audit --no-fund npm@11.19.1

      - name: Download the release tarball and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "coagent8-$version.tgz" --pattern SHA256SUMS

      # The same file the owner verified: its checksum and the provenance of release.yml.
      - name: Verify checksum and build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          (cd release && sha256sum --check --ignore-missing --strict SHA256SUMS)
          grep -q " coagent8-$version.tgz\$" release/SHA256SUMS \
            || { echo "::error::SHA256SUMS lists no coagent8-$version.tgz"; exit 1; }
          gh attestation verify "release/coagent8-$version.tgz" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      # Stages ./release/coagent8-X.Y.Z.tgz to `next` (scripts/publish-npm.cjs, RELEASE-001a/b1).
      - name: Stage on npm
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm_execpath="$RUNNER_TEMP/npm/node_modules/npm/bin/npm-cli.js" node scripts/publish-npm.cjs
