name: CI

# Protected branches: develop and the release lines X.Y.x (Git workflow rule 02).
# The six job names below are the ruleset's required checks; renaming one blocks merges
# until the ruleset is updated.
on:
  push:
    branches: [develop, '[0-9]+.[0-9]+.x']
  pull_request:
    branches: [develop, '[0-9]+.[0-9]+.x']

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # A complete job takes a few minutes; a hung test must not hold a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tooling/documentation/package-lock.json
            tooling/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: npm ci --prefix tooling/documentation

      - name: Typecheck
        run: npm run typecheck

      - name: Verify dependency boundaries
        run: npm run check:dependencies

      - name: Validate TSDoc comments
        run: npm run lint:docs

      # The generated documentation does not depend on the platform: one job checks it.
      - name: Generate source API documentation
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        run: npm run docs

      - name: Build bundle
        run: npm run build

      # The full suite runs once, under coverage (AUD-P2-15). Development regression floor:
      # statements/lines/branches >=70%, functions >=75%; all src modules, no exclusions.
      # This is not the RC safety-branch acceptance gate.
      - name: Run test suite with source coverage
        run: npm run test:coverage

      - name: Verify package bundle integrity
        run: npm pack --dry-run

      - name: Install exact tarball and verify consumer MCP
        run: npm run test:consumer

      - name: Verify npm publish dry-run on packed tarball
        run: node scripts/publish-npm.cjs --dry-run


      - name: Install VSIX packaging dependencies (Node 24)
        if: matrix.node-version == '24.x'
        run: npm ci --prefix tooling/vscode

      - name: Package VS Code development extension (Node 24)
        if: matrix.node-version == '24.x'
        run: npm run package:vscode

      - name: Upload consumer and coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-node-${{ matrix.node-version }}
          # The folder name starts with a dot, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/
