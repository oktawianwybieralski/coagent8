name: Bug report
description: Report a CoAgent8 problem, including beta feedback.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Only the first field is required. Remove credentials and private project content from anything you paste.'
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. The tool arguments and the error help most.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CoAgent8 version, the client (VS Code, Claude Code...) and the backend that failed, if you know them.
  - type: textarea
    id: issue
    attributes:
      label: CoAgent8 issue or doctor output
      description: Optional. The issue tool prepares a sanitized report, and doctor shows backend health.
  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Optional. Logs, screenshots, or whether restarting the MCP server changes the result.
