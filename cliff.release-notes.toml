# git-cliff configuration for GitHub release notes (CHANGELOG-001), modeled on the
# PrestaShop release pages: entries grouped by area (commit scope), then by type;
# each entry is "#PR: description (by @author)"; contributors and a compare link
# follow. Run `npm run release-notes -- --tag vX` in the release procedure and pass
# the output to `gh release create --notes-file`. Known issues and security notes
# are added by hand (Git governance section 6).
#
# With GITHUB_TOKEN set, authors and PR numbers come from the GitHub API. Without
# it, the PR number is read from the "(#N)" suffix of the squash-merge subject and
# the author is the Git author name.

[remote.github]
owner = "oktawianwybieralski"
repo = "coagent8"

[changelog]
header = ""
body = """
{% set repo = "https://github.com/oktawianwybieralski/coagent8" -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 -%}
## Breaking changes

{% for commit in breaking -%}
{{ self::entry(commit=commit, repo=repo) }}
{% endfor %}
{% endif -%}
## Changes
{% for scope, area in commits | group_by(attribute="scope") %}
### {{ scope | upper_first }}
{% for group, items in area | group_by(attribute="group") %}
#### {{ group | striptags | trim }}

{% for commit in items -%}
{{ self::entry(commit=commit, repo=repo) }}
{% endfor -%}
{% endfor -%}
{% endfor %}
{% if github.contributors | length > 0 -%}
## Contributors

{% for contributor in github.contributors | filter(attribute="username") -%}
- [@{{ contributor.username }}](https://github.com/{{ contributor.username }}){% if contributor.is_first_time %} made their first contribution in [#{{ contributor.pr_number }}]({{ repo }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor %}
{% endif -%}
{% if previous.version -%}
**Full Changelog**: [{{ previous.version }}...{{ version }}]({{ repo }}/compare/{{ previous.version }}...{{ version }})
{% else -%}
**Full Changelog**: [{{ version }}]({{ repo }}/commits/{{ version }})
{% endif -%}

{% macro entry(commit, repo) -%}
{% if commit.remote.pr_number -%}
{% set number = commit.remote.pr_number -%}
{% elif commit.message is containing(" (#") -%}
{% set number = commit.message | split(pat=" (#") | last | trim_end_matches(pat=")") -%}
{% else -%}
{% set number = "" -%}
{% endif -%}
{% set text = commit.message | split(pat=" (#") | first | upper_first -%}
- {% if number %}[#{{ number }}]({{ repo }}/pull/{{ number }}){% else %}[`{{ commit.id | truncate(length=7, end="") }}`]({{ repo }}/commit/{{ commit.id }}){% endif %}: {{ text }} (by {% if commit.remote.username %}[@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% else %}{{ commit.author.name }}{% endif %})
{%- endmacro entry %}
"""
trim = true
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
# Same type mapping as cliff.toml; commits without a scope are listed under "General".
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New features", default_scope = "general" },
  { message = "^(perf|refactor)", group = "<!-- 1 -->Improvements", default_scope = "general" },
  { message = "^revert", group = "<!-- 2 -->Removals", default_scope = "general" },
  { message = "^fix", group = "<!-- 3 -->Bug fixes", default_scope = "general" },
  { message = "^(docs|chore|test|ci|build|style)", skip = true },
]
