# git-cliff configuration for GitHub release notes (CHANGELOG-001): an expanded
# "Full Changelog" list by area (commit scope), then type, then
# "#PR: description (by @author)", like CHANGELOG.md;
# contributors and a compare link follow. GitHub links "#N" and "@user" in release
# notes itself. release.yml renders it below the tester header that the release PR adds
# as docs/releases/vX.Y.Z.md (scripts/release-notes.cjs, RELEASE-001e); `npm run
# release-notes -- --tag vX` previews it.
#
# With GITHUB_TOKEN set, authors and PR numbers come from the GitHub API. Without
# it, the PR number is read from the "(#N)" suffix of the squash-merge subject and
# the author from GitHub's no-reply author address, else the Git author name.

[remote.github]
owner = "oktawianwybieralski"
repo = "coagent8"

[changelog]
header = ""
body = """
{% set repo = "https://github.com/oktawianwybieralski/coagent8" -%}
## Full Changelog
{# A breaking commit is listed under "Breaking change" of its area only, not
   again under its type. #}
{% for scope, area in commits | group_by(attribute="scope") %}
- {{ self::area(scope=scope) }}:
{%- set breaking = area | filter(attribute="breaking", value=true) %}
{%- if breaking | length > 0 %}
  - Breaking change:
{%- for commit in breaking %}
    {{ self::entry(commit=commit) }}
{%- endfor %}
{%- endif %}
{%- for group, items in area | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
  - {{ group | striptags | trim }}:
{%- for commit in items %}
    {{ self::entry(commit=commit) }}
{%- endfor %}
{%- endfor %}
{%- endfor %}


{% if github.contributors | length > 0 -%}
## Contributors

{% for contributor in github.contributors | filter(attribute="username") -%}
- @{{ contributor.username }}{% if contributor.is_first_time %} made their first contribution in #{{ contributor.pr_number }}{% endif %}
{% endfor %}
{% endif -%}
{% if previous.version -%}
**Compare**: [{{ previous.version }}...{{ version }}]({{ repo }}/compare/{{ previous.version }}...{{ version }})
{% else -%}
**Compare**: [{{ version }}]({{ repo }}/commits/{{ version }})
{% endif -%}

{# Commit scopes are short; release readers see product names (RELEASE-001e). #}
{% macro area(scope) -%}
{% if scope == "vscode" %}VS Code{% elif scope == "mcp" %}MCP{% elif scope == "agy" %}Antigravity (agy){% elif scope == "cli" %}CLI{% else %}{{ scope | upper_first }}{% endif %}
{%- endmacro area %}
{% macro entry(commit) -%}
{% if commit.remote.pr_number -%}
{% set number = commit.remote.pr_number -%}
{% elif commit.message is containing(" (#") -%}
{% set number = commit.message | split(pat=" (#") | last | trim_end_matches(pat=")") -%}
{% else -%}
{% set number = "" -%}
{% endif -%}
{% set text = commit.message | split(pat=" (#") | first | upper_first -%}
{% set email = commit.author.email | default(value="") -%}
- {% if number %}#{{ number }}{% elif commit.id %}{{ commit.id | truncate(length=7, end="") }}{% else %}`pending`{% endif %}: {{ text }} (by {% if commit.remote.username %}@{{ commit.remote.username }}{% elif email is ending_with("@users.noreply.github.com") %}@{{ email | split(pat="@") | first | split(pat="+") | last }}{% else %}{{ commit.author.name }}{% endif %})
{%- endmacro entry %}
"""
trim = false
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
# Newest first within each type, as merged.
sort_commits = "newest"
# Same type mapping as cliff.toml; commits without a scope are listed under
# "General". A breaking commit of an omitted type is kept
# (protect_breaking_commits) and listed under "Breaking change" of its area.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New feature", default_scope = "general" },
  { message = "^perf", group = "<!-- 1 -->Improvement", default_scope = "general" },
  { message = "^fix", group = "<!-- 2 -->Bug fix", default_scope = "general" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring", default_scope = "general" },
  { message = "^revert", group = "<!-- 4 -->Removal", default_scope = "general" },
  { message = "^(docs|chore|test|ci|build|style)", skip = true, default_scope = "general" },
]
